<div class="mainContent">
    <header>
        <h1 class="title">
        <span class="english">ENGLISH</span><span class="to">-TO-</span><span class="french">FRENCH</span>
        </h1>
    </header>

    <main>
        <p>Translate English to french now</p>
        <p class="instruction">Enter your English word or phrase for translation below</p>
        <div class="container">
        <div class="languageContainer">
        <label for="inputText">English</label>
        <textarea
            id="inputText"
            placeholder="Enter English text here..."
        ></textarea>
        <button id="translateButton" type="button">Translate</button>
        <button id="clearButton" type="button">Clear</button>
        </div>

        <div class="languageContainer">
        <label for="outputText">French</label>
        <textarea
            id="outputText"
            placeholder="French translation will appear here..."
            readonly
        ></textarea>
        <button id="copyButton" type="button">Copy</button>
        </div>
        </div>

    </main>
    </div>

    <footer class="siteFooter">
        <div class="footerContent">
            <img
                class="footerLogo"
                src="https://www.gdgbabcock.com/gdg-logo.svg"
                alt="Google Developer Group, Babcock University"
            >
            <h2>GDG Babcock</h2>
            <p>Google Developer Group</p>
            <p>Babcock University</p>
        </div>
    </footer>
</body>
